[project]
name = "voicerecog"
version = "0.1.0"
description = ""
authors = [{ name = "sondeko", email = "sondeko143@gmail.com" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "google-cloud-translate>=3.11.1,<4",
    "httpx>=0.28.0,<0.29.0",
    "pydantic>=2,<3",
    "aiofiles>=23.1.0,<24",
    "pyhumps>=3.8.0,<4",
    "google-cloud-speech>=2.19.0,<3",
    "toml>=0.10.2,<0.11",
    "click>=8.1.3,<9",
    "vstreamer-protos",
    "colorlog>=6.7.0,<7",
    "emoji>=2.6.0,<3",
    "ctranslate2>=4.6.1,<5",
    # obs-websocket 5.x クライアント (ADR-0043)。依存ゼロ。websockets の API 変更
    # (websockets.client.connect -> websockets.asyncio.client.connect) の影響は
    # lib/obs_ws.py に閉じ込める。
    "websockets>=14,<17",
    # PEP 594 で stdlib から外れた audioop の後方移植 (C ポート)。recording/playback/vc は
    # `import audioop` のまま、飽和セマンティクスを保ったまま動く。
    "audioop-lts",
]

[project.optional-dependencies]
voicevox = ["voicevox-core"]
whisper = [
    "faster-whisper==1.2.1",
    # >=1.27: CUDA 13 世代に対応する最初の版 (roadmap フェーズ2)。
    "onnxruntime-gpu>=1.27,<2",
    "numpy>=2,<3",
]
rvc = [
    # >=1.27: CUDA 13 世代 (下の nvidia wheel 群) に対応する最初の版 (roadmap フェーズ2)。
    "onnxruntime-gpu>=1.27,<2",
    # CUDA ランタイムの供給元 (ADR-0083)。onnxruntime-gpu の wheel は CUDA を同梱しない。
    # 名指しなのは `onnxruntime-gpu[cuda,cudnn]` が解決不能なため — 1.27.0 は
    # `nvidia-cuda-nvrtc-cu13~=13.0` を pin するが、NVIDIA は CUDA 13 世代で `-cu13`
    # 接尾辞を落としており、その名前は PyPI ではスタブ (0.0.1) しか存在しない。
    #
    # 内訳は onnxruntime 1.27.0 (build CUDA 13.0) が Windows で探す DLL そのもの
    # (`onnxruntime/__init__.py` の `_get_nvidia_dll_paths`)。上 3 つは
    # onnxruntime_providers_cuda.dll の import table に載る = 無いと DLL が load すら
    # できない。cuda-runtime だけは import table に無いが、preload の対象なので
    # 欠けると起動ごとに偽の失敗メッセージが出る (2.5MB なので入れる)。
    #   cublas      -> cublas64_13.dll / cublasLt64_13.dll
    #   cudnn-cu13  -> cudnn64_9.dll ほか cuDNN サブ DLL 7 個 (cuDNN のみ旧命名のまま)
    #   cufft       -> cufft64_12.dll        (CUDA 13 世代の cuFFT は 12.x)
    #   cuda-runtime-> cudart64_13.dll
    # 上限は DLL 名に焼かれたメジャー版そのもの (cublas64_13 / cufft64_12 / cudnn64_9)。
    # ただし解決器はこれを onnxruntime の要求と突き合わせない — onnxruntime-gpu の
    # nvidia 依存は [cuda]/[cudnn] extra 側にあり、こちらは要求していないため。つまり
    # CUDA 14 の onnxruntime を入れても lock は緑のまま通る。気付く場所は
    # tests/test_onnx_session.py::test_each_preload_is_pointed_at_a_directory_that_has_what_it_wants
    # で、onnxruntime が要求する DLL 名が実在しなくなった時点で赤くなる。
    # 罠: nvidia-cublas は win_amd64 wheel を出さない版がある (13.6.1.10。13.6.0.2 にはある)。
    # 「win_amd64 wheel がある版」はバージョン式では書けないので、判明している版を名指しで
    # 除外する。除外しないと、次に lock を取り直した誰かが上限内の最新として 13.6.1.10 を
    # 掴み、解決が落ちる。今 13.6.0.2 なのは lock がそう固定しているからにすぎず、制約が
    # それを要求していたわけではない。将来また wheel の無い版が出たら同じ形で lock が
    # 落ちる (environments が win32 のみなので wheel が無ければ解決できない) ので、
    # そのときここに `!=<版>` を足す。
    # sys_platform マーカー: この 4 つは win_amd64 wheel しか存在しない CUDA ランタイムで、
    # このファイルの他のプラットフォーム固有 pin (pyvcroid2 / voicevox-core) と同じ性質。
    # [tool.uv] environments が win32 だけを解決するので実効上の差は無いが、要求そのものが
    # 「Windows でだけ要る」と読めるようにしておく。
    "nvidia-cublas>=13.6.0.2,!=13.6.1.10,<14 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu13>=9.24.0.43,<10 ; sys_platform == 'win32'",
    "nvidia-cufft>=12.3.0.29,<13 ; sys_platform == 'win32'",
    "nvidia-cuda-runtime>=13.3.29,<14 ; sys_platform == 'win32'",
    "numpy>=2,<3",
    # 保留 (ADR-0080 の範囲外): scipy を import しているのは tests/test_pitch_extract.py
    # だけで、`vspeech/` からは 0 件になった (リサンプルは ADR-0082 で自前ポリフェーズへ)。
    # つまりこれは実質テスト専用依存だが、外すには dev グループへ移す判断が要り、それは
    # torch/torchaudio/faiss-cpu を外すという本 ADR の決定とは別の決定になる。次にここを
    # 触る人が、rvc extra から落として dev へ移すかを決めること。
    "scipy>=1.10.1,<2",
]
mozc = ["mozcpy>=0.1.1,<0.2"]
vroid2 = ["pyvcroid2 ; sys_platform == 'win32'"]
# PortAudio 同梱の py3-none wheel (ABI 非依存) なので cp314 でも wheel が入る。
audio = ["sounddevice>=0.5,<0.6"]

[project.urls]
Repository = "https://github.com/sondeko143/vstreamer-tool"

[project.scripts]
vspeech = "vspeech.main:cmd"
# 追加依存ゼロの制御コマンド (ADR-0061): click / grpc は既にコア依存。
vsctl = "cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "docutils>=0.19,<0.20",
    "pytest-cov>=6.0.0,<8",
    "pytest-grpc>=0.8.0,<0.9",
    "pytest-asyncio>=1.0,<2",
    "pytest-httpx",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "poethepoet>=0.46.0",
    "beniget>=0.5.0",
    "onnx>=1.19,<2",
]

[tool.uv]
default-groups = "all"
# voicevox-core / pyvcroid2 are Windows-only wheels, and onnxruntime-gpu has no macOS
# wheel. This project targets Windows only (ADR-0067 removed the Linux container
# deploy), so resolve for that platform alone.
environments = [
    "sys_platform == 'win32'",
]
# faster-whisper depends on the CPU `onnxruntime`, which shares the same `onnxruntime`
# module with `onnxruntime-gpu` and clobbers its CUDA-enabled binary when both are
# installed. Drop the CPU build entirely; `onnxruntime-gpu` (in the whisper/rvc extras)
# provides the `onnxruntime` module that faster-whisper imports.
override-dependencies = ["onnxruntime ; sys_platform == 'never'"]

[tool.uv.sources]
vstreamer-protos = { url = "https://github.com/sondeko143/vstreamer-protos/releases/download/v0.1.1/vstreamer_protos-0.1.1-py3-none-any.whl" }
voicevox-core = { url = "https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/voicevox_core-0.16.4-cp310-abi3-win_amd64.whl" }
pyvcroid2 = { git = "https://github.com/Nkyoku/pyvcroid2" }

[tool.uv.build-backend]
# cli も同梱する。`vsctl` の entry point (cli.main:main) が解決できなくなるため。
module-name = ["vspeech", "cli"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "scripts/tests"]
pythonpath = "."
asyncio_mode = "auto"
addopts = "-m 'not voicevox_e2e'"
markers = [
    "voicevox_e2e: VOICEVOX 実合成 E2E（実行時資産が必要。通常実行では除外）",
]

[tool.coverage.run]
# PEP 669 の sys.monitoring で計測する (3.12 以降でのみ選べる)。C トレーサと同じ数字が
# 出て、オーバーヘッドは 1/3 になる (このスイートで +7.9s -> +2.7s)。
# 環境変数 COVERAGE_CORE が指定されていればそちらが優先される。
core = "sysmon"

[tool.ty.environment]
python-version = "3.14"

# scripts/convert_hubert.py と scripts/export_hubert_onnx.py はオフライン専用ツール。
# その依存 (fairseq / transformers / onnx / safetensors) は poe task の `uv run --with`
# が一時環境で供給するので、プロジェクト依存ではない。未解決 import はここでは正常な
# 状態であって、`python-health` が禁じる「extras 未同期による偽陽性の抑制」ではない。
[[tool.ty.overrides]]
include = [
    "scripts/convert_hubert.py",
    "scripts/export_hubert_onnx.py",
    "scripts/export_fcpe_onnx.py",
]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

# Task automation lives in poe_tasks.toml (included below), kept out of this file
# so pyproject stays focused on package metadata. Run any task via
# `uv run poe <task>`; `uv run poe` with no task lists them all.
[tool.poe]
include = ["poe_tasks.toml"]
