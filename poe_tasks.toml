# Task automation for this project, run via poethepoet: `uv run poe <task>`.
# Split out of pyproject.toml (pulled back in via `[tool.poe] include`) so
# pyproject stays focused on package metadata. This is the single task runner:
# the former Makefile's voicevox-assets target was folded in here too; its
# requirements-pod and clean targets went away with the container deploy (ADR-0067).
#
# The `python-health` skill drives the health gates:
#   uv run poe check   → run every gate report-only (keeps going on failure)
#   uv run poe fix     → apply only the mechanical fixes (ruff format + safe lint)
# On GPU/ML projects, prefix with extras so ty/pytest resolve optional backends:
#   uv run --all-extras poe check
[tool.poe.tasks]
fmt = { cmd = "ruff format .", help = "Apply ruff formatting" }
fmt-check = { cmd = "ruff format --check .", help = "Check formatting (no writes)" }
lint = { cmd = "ruff check .", help = "Lint (no writes)" }
lint-fix = { cmd = "ruff check --fix .", help = "Apply safe lint fixes" }
type = { cmd = "ty check", help = "Type-check (ty)" }
test = { cmd = "pytest --cov=vspeech --cov-report=term-missing", help = "Tests + coverage (honors addopts)" }
lock-check = { cmd = "uv lock --check", help = "Lockfile is in sync with pyproject" }
audit = { cmd = "uv audit", help = "Dependency vulnerability audit" }
security = { cmd = "uv run --with bandit bandit -q -r vspeech cli", help = "Security lint (bandit, project interpreter)" }
deadcode = { cmd = "uv run --with vulture vulture vspeech --min-confidence 80", help = "Dead-code scan (advisory)" }

# 一度きりのオフライン工程。依存 (torch / fairseq / transformers / torchfcpe / onnx /
# onnxscript) は pyproject にも uv.lock にも載せず、`uv run --with` の一時環境で供給する。
# `poe security` / `poe deadcode` と同じ手口。torch がここにしか無いのが ADR-0080 の要点で、
# ランタイム依存へ戻すと ctranslate2 が掴んで削減が消える。
#
# convert-hubert: hubert_base.pt -> hubert_contentvec/ (transformers 資産)。
#   `--python 3.11` は必須。省くとプロジェクトの 3.14 に落ち、cp311 の fairseq wheel が
#   入らない。`--no-project` なので [tool.uv.sources] は読まれず、torch は PyPI 版
#   (Windows は CPU) になる。変換は CPU で足りるのでこれでよい。
#   例: uv run poe convert-hubert --input ~/.config/vstreamer/hubert_base.pt \
#           --output ./hubert_contentvec --golden ./hubert_golden
convert-hubert = { cmd = "uv run --isolated --no-project --python 3.11 --with 'fairseq @ https://github.com/sondeko143/fairseq-311/releases/download/v0.12.2.post1/fairseq-0.12.2.post1-cp311-cp311-win_amd64.whl' --with 'numpy<1.24' --with torch --with transformers python -m scripts.convert_hubert", help = "hubert_base.pt -> transformers asset (offline, throwaway 3.11 env)" }
# export-hubert-onnx: hubert_contentvec/ -> hubert_fp32.onnx + hubert_fp16.onnx。
#   `--no-project` は付けない: このスクリプトは vspeech.lib.rvc と scripts.hubert_metrics を
#   import するのでプロジェクト環境が要る。`--all-extras` なのは、素の `uv run` が venv を
#   「extra 無し」へ同期し直して rvc/whisper/voicevox を剥がしてしまうため。
#   torch は wheel を URL で直指しする (ADR-0080)。理由は 2 つ:
#     - fp16 グラフを CUDA 上で export するので CPU wheel では落ちる。Windows の PyPI
#       torch は CPU ビルドで、`[tool.uv.sources]` は `--with` の解決には効かない
#       (実測: `--with torch` で来たのは 2.13.0+cpu)。
#     - torch を依存から外す直前の資産を作ったのと同じ wheel に固定され、export が
#       ツールチェーン差ではなく資産の差だけを反映する。
#   URL が 404 になったら (Python か torch を上げたとき) ここを差し替える。
#   VRAM: fp16 の検証セッションが単一の Conv で 9.95GB を要求する。8GB のカードが cuda:0
#   だと必ず OOM で落ちるので、それだけ載るカードの序数を `CUDA_VISIBLE_DEVICES` に入れて
#   cuda:0 に見せてから実行する (実測: 16GB のカードなら通る)。
#   例 (PowerShell): $env:CUDA_VISIBLE_DEVICES = "<十分な VRAM を持つカードの序数>"
#                    uv run poe export-hubert-onnx --asset ./hubert_contentvec --golden ./hubert_golden
export-hubert-onnx = { cmd = "uv run --all-extras --with 'torch @ https://download.pytorch.org/whl/cu130/torch-2.13.0%2Bcu130-cp314-cp314-win_amd64.whl' --with transformers --with onnx --with onnxscript python -m scripts.export_hubert_onnx", help = "transformers asset -> ONNX (offline, project env + CUDA torch overlay)" }
# export-fcpe-onnx: torchfcpe の bundled FCPE -> fcpe.onnx (波形入力)。torch は
#   オーバーレイから来る (ADR-0080)。ここは PyPI の CPU wheel で足りる — export も検証も
#   `torch.device("cpu")` で行うので CUDA ビルドは要らない。`--all-extras` は検証で使う
#   onnxruntime のため、かつ単独 extra が他を剥がすのを避けるため。STFT を conv1d-DFT に
#   差し替えて legacy tracer で export する詳細は ADR-0049 と
#   scripts/export_fcpe_onnx.py の docstring。
#   例: uv run poe export-fcpe-onnx --output ~/.config/vstreamer/fcpe.onnx
export-fcpe-onnx = { cmd = "uv run --all-extras --with torch --with torchfcpe --with onnx --with onnxscript python -m scripts.export_fcpe_onnx", help = "FCPE -> waveform-input ONNX (offline, project env + overlay)" }

# RVC ストリーミング VC の RTF 実測ハーネス。--all-extras で sync 済みの
# プロジェクト環境で走らせる(rvc extra の onnxruntime-gpu が要る)。
#   uv sync --all-extras
#   uv run poe stream-vc-rtf --config ./config.toml
# 掃引軸は --block-ms / --context-ms / --f0 / --iters / --margin で上書き可。
stream-vc-rtf = { cmd = "python scripts/stream_vc_rtf.py", help = "Measure per-block latency/RTF of streaming VC across block/context/f0" }

# Stream VC の数値ベースライン採取と A/B 判定 (ADR-0080/0081)。--all-extras で sync 済みの
# プロジェクト環境で走らせる。設定は $VSPEECH_STREAM_VC_BASELINE_CONFIG か --config で渡す
# ([stream_vc] を読む。RTF ハーネスと違い [rvc] へ写す必要は無い)。
#   uv run poe stream-vc-baseline capture    # ベースライン npz + レイテンシ系列を書く
#   uv run poe stream-vc-baseline compare    # 現行実装を同じ入力・同じ seed で突き合わせる
# compare の終了コードは 3 値: 0=bit 一致(合格) / 2=許容内だが不一致(要判断、合格ではない)
# / 1=不合格。幾何とモデル provenance が baseline と違えば判定せず中止する。
# 成果物 (tests/assets/rvc_golden/stream_vc_baseline.npz) は gitignore 済。
stream-vc-baseline = { cmd = "python -m scripts.stream_vc_baseline", help = "Capture/compare the Stream VC numeric baseline (A/B gate for the torch removal)" }

# ランタイムの各 import 経路が持ち込むモジュール集合と常駐メモリの基準データを取り直す
# (ADR-0085、経路を広げたのが ADR-0087)。通常のテスト実行に常駐する成果ゲート
# tests/test_runtime_footprint.py が読む tests/runtime_startup_baseline.json を書き直すのが
# これ。GPU も実行時資産も要らない。測る経路はスクリプト内の MEASURED_PATHS で、ワーカーが
# 遅延 import の先で読み込む重い依存 (faster_whisper -> ctranslate2 など) を通る。
# **ワーカーや起動経路を足したら MEASURED_PATHS にも足すこと。** 測っていない経路で
# 重くなったものは、もう何も検出しない。
#   uv run poe runtime-baseline                    # 実測して現状の値を見るだけ
#   uv run poe runtime-baseline --only vc          # 調査用に 1 経路だけ測る (--update 不可)
#   uv run poe runtime-baseline --update --runs 10 # 基準データを書き直す
# **`--` を挟まないこと。** poe は `--` をタスクへそのまま渡すので、argparse が引数列ごと
# 拒否して終了コード 2 になり、何も書かれない (実測)。
# 機能追加でモジュール集合が正当に増えたときの手順がこれで、ゲートの失敗メッセージも
# このコマンドを案内する。--runs は 10 未満だと --update が拒否される: 予算は「見た中で
# 最悪の run」に張り付くので、回数が少ないほど**狭い**予算が書かれてゲートが暴れる。
# --update したら **差分を読んで承認してからコミットする**
# (増えた名前が意図した依存かどうかを見る場所がそこしかない)。
runtime-baseline = { cmd = "python -m scripts.runtime_startup_baseline", help = "Measure/record the runtime startup module set and resident memory baseline (ADR-0085)" }

# VC パイプラインの起動時間と常駐メモリを実測する (ADR-0080)。torch 導入前後で同じ手順を
# 再実行して差を取るためのもの。
#   uv run poe vc-footprint --config ~/.config/vstreamer/config_vc.toml --runs 3
vc-footprint = { cmd = "python -m scripts.vc_pipeline_footprint", help = "Measure a vspeech pipeline's startup time and resident memory (exact PID)" }

# lookahead(右文脈)ごとの変換品質をバッチ経路と比較する (ADR-0072)。--all-extras で
# sync 済みのプロジェクト環境で走らせる。RTF ハーネスと違い **[stream_vc.rvc] をそのまま
# 読む**ので、[rvc] へ写す必要は無い。
#   uv sync --all-extras
#   uv run poe stream-vc-lookahead-eval --config ./config.toml --input voice.wav
# log-mel 距離の表と、各設定の wav (バッチ基準を含む) を出す。
stream-vc-lookahead-eval = { cmd = "python scripts/stream_vc_lookahead_eval.py", help = "Compare streaming VC output against the batch path across lookahead settings" }

# Complexity insight (advisory; separate from the health gates above) — driven by the
# `code-metrics` skill. Shells out to `uvx lizard` + `uvx complexipy`, plus an in-process
# beniget DepDegree (def-use coupling) lens that catches entangled mutable state:
#   uv run poe metrics          → ranked refactor candidates (cyclomatic + cognitive + dep)
#   uv run poe metrics --json   → machine-readable
metrics = { cmd = "python scripts/metrics.py", help = "Rank refactor candidates: lizard CCN + complexipy cognitive + beniget DepDegree (advisory)" }

# Startup profiling (advisory) — driven by the `startup-profile` skill. Shells out to
# `uvx py-spy`; the analyzer is pure stdlib. Capture auto-analyzes inline:
#   uv run poe startup-profile                    → profile the baseline (all workers off) + rank buckets
#   uv run poe startup-profile --config <file>    → profile a real config instead
#   uv run poe startup-sweep                      → baseline + one config per worker, with a comparison table
#   uv run poe startup-analyze -- --input <file>  → re-rank an existing speedscope profile (by bucket)
startup-profile = { cmd = "python scripts/startup_capture.py", help = "Capture+analyze a py-spy startup profile of vspeech (advisory)" }
startup-sweep = { cmd = "python scripts/startup_capture.py --sweep", help = "Profile baseline + each worker and compare startup cost (advisory)" }
startup-analyze = { cmd = "python scripts/startup_analyze.py", help = "Rank startup time by bucket from a speedscope profile (advisory)" }

# VOICEVOX の実行時資産 (ONNX Runtime / OpenJTalk 辞書 / .vvm) を tests/assets/voicevox へ
# 取得する（旧 Makefile の voicevox-assets）。多行なので shell タスク (POSIX shell が要る)。
# --devices は cpu/cuda/directml から選ぶ。出力先は gitignore 済。
[tool.poe.tasks.voicevox-assets]
help = "Download VOICEVOX runtime assets into tests/assets/voicevox (offline)"
shell = """
curl -sSfL https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/download-windows-x64.exe -o download-voicevox.exe
./download-voicevox.exe -o tests/assets/voicevox --exclude c-api --devices cuda
echo "デバイスを変える場合は --devices (cpu/cuda/directml) を指定。フラグは ./download-voicevox.exe --help を参照。"
"""

[tool.poe.tasks.fix]
help = "Auto-apply mechanical fixes (ruff format + safe lint fixes)"
sequence = ["fmt", "lint-fix"]
default_item_type = "ref"

[tool.poe.tasks.check]
help = "Run every health gate report-only; keeps going if one fails, exits non-zero if any did"
sequence = [
    "fmt-check",
    "lint",
    "type",
    "test",
    "lock-check",
    "audit",
    "security",
    "deadcode",
]
default_item_type = "ref"
ignore_fail = "return_non_zero"
